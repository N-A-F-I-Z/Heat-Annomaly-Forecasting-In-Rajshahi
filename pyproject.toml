[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heatcast"
version = "0.1.0"
description = "Probabilistic forecasting of extreme-heat weeks in Rajshahi from ERA5-Land climatology and recent anomalies"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
gee = ["earthengine-api>=0.1.390"]
openmeteo = ["requests>=2.31"]
dev = ["pytest>=7"]

[project.scripts]
heatcast = "heatcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
