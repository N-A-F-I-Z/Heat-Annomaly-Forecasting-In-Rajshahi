name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: End-to-end smoke test on synthetic data
        run: heatcast all --source synthetic --data /tmp/synth.csv --out /tmp/results --quick
